<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Hello, I am Toka</title>
  <desc id="description">Hello, I am above the name Toka in elegant rose-gold calligraphy with sweeping flourishes.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Playfair Embedded";
        src: url("data:font/woff2;base64,") format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "Great Vibes Embedded";
        src: url("data:font/woff2;base64,") format("woff2");
        font-weight: 400;
      }
      .intro { font-family: "Playfair Embedded", Georgia, serif; }
      .name { font-family: "Great Vibes Embedded", "Snell Roundhand", cursive; }
    </style>
    <linearGradient id="rose-gold" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5b2727"/>
      <stop offset="0.2" stop-color="#bc735b"/>
      <stop offset="0.42" stop-color="#f5c6a4"/>
      <stop offset="0.58" stop-color="#fff0dc"/>
      <stop offset="0.73" stop-color="#c9795f"/>
      <stop offset="1" stop-color="#5a2528"/>
    </linearGradient>
    <linearGradient id="bright-copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#673033"/>
      <stop offset="0.28" stop-color="#e29a77"/>
      <stop offset="0.5" stop-color="#ffe0bd"/>
      <stop offset="0.72" stop-color="#d08062"/>
      <stop offset="1" stop-color="#612b30"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="5" result="offset"/>
      <feFlood flood-color="#261518" flood-opacity="0.42"/>
      <feComposite in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <ellipse cx="600" cy="392" rx="320" ry="18" fill="#6d4747" opacity="0.12" filter="url(#soft-glow)"/>

  <text class="intro" x="600" y="165" text-anchor="middle" font-size="106" font-weight="600" letter-spacing="1" fill="url(#rose-gold)" stroke="#4a272b" stroke-width="1.2" paint-order="stroke fill" filter="url(#soft-shadow)">Hello, I am</text>

  <g fill="none" stroke="url(#bright-copper)" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-shadow)">
    <path d="M445 277 C389 238 320 244 286 287 C257 324 287 352 329 338 C372 324 389 274 433 271 C463 269 484 287 483 311 C482 345 448 364 414 353 C382 343 374 306 390 286" stroke="#542a30" stroke-width="9" opacity="0.95"/>
    <path d="M445 277 C389 238 320 244 286 287 C257 324 287 352 329 338 C372 324 389 274 433 271 C463 269 484 287 483 311 C482 345 448 364 414 353 C382 343 374 306 390 286" stroke-width="5.5"/>
    <path d="M761 315 C799 286 840 272 881 283 C917 293 930 321 905 338 C883 353 851 337 846 316 C840 289 872 267 907 274 C944 282 954 320 933 342" stroke="#542a30" stroke-width="9" opacity="0.95"/>
    <path d="M761 315 C799 286 840 272 881 283 C917 293 930 321 905 338 C883 353 851 337 846 316 C840 289 872 267 907 274 C944 282 954 320 933 342" stroke-width="5.5"/>
  </g>

  <text class="name" x="600" y="365" text-anchor="middle" font-size="222" fill="url(#rose-gold)" stroke="#51262c" stroke-width="1.7" paint-order="stroke fill" filter="url(#soft-shadow)">Toka</text>

  <path d="M445 376 C520 400 663 402 759 371 C698 416 525 422 445 376 Z" fill="url(#bright-copper)" opacity="0.88"/>
</svg>
