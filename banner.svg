<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Hello, I am Toka</title>
  <desc id="description">The words Hello, I am Toka in luxurious gold calligraphy with elegant ornamental flourishes.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Great Vibes Embedded";
        src: url("data:font/woff2;base64,") format("woff2");
        font-style: normal;
        font-weight: 400;
      }
      .calligraphy {
        font-family: "Great Vibes Embedded", "Snell Roundhand", "Segoe Script", cursive;
      }
    </style>
    <linearGradient id="gold" x1="0" y1="0" x2="0.95" y2="1">
