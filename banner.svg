<svg viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2005" />
      <stop offset="15%" stop-color="#b8973b" />
      <stop offset="30%" stop-color="#f3e5ab" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="60%" stop-color="#aa7c11" />
      <stop offset="75%" stop-color="#fdf0cd" />
      <stop offset="90%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#4a3908" />
    </linearGradient>

    <!-- Subtle Inner Gold Glow/Highlight -->
    <linearGradient id="lightGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#996515" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#ffdf73" />
    </linearGradient>

    <!-- Soft Drop Shadow for Luxurious Depth -->
    <filter id="luxuryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="1" flood-color="#554400" flood-opacity="0.4" />
    </filter>

    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1a0e" />
      <stop offset="100%" stop-color="#0d0b06" />
    </radialGradient>
  </defs>

  

  <!-- Background -->
  <rect width="800" height="250" rx="12" class="bg" />

  <!-- Outer Elegant Frame -->
  <rect x="25" y="22" width="750" height="206" rx="8" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.6" />
  <rect x="33" y="30" width="734" height="190" rx="6" fill="none" stroke="url(#goldGradient)" stroke-width="0.75" opacity="0.3" />

  <!-- Top & Bottom Center Diamond Accents -->
  <polygon points="400,16 405,22 400,28 395,22" class="diamond" />
  <polygon points="400,222 405,228 400,234 395,228" class="diamond" />

  <!-- Corner Ornamental Accents -->
  <!-- Top Left -->
  <path d="M 40 45 L 65 45 M 40 45 L 40 70" class="ornament" />
  <!-- Top Right -->
  <path d="M 760 45 L 735 45 M 760 45 L 760 70" class="ornament" />
  <!-- Bottom Left -->
  <path d="M 40 205 L 65 205 M 40 205 L 40 180" class="ornament" />
  <!-- Bottom Right -->
  <path d="M 760 205 L 735 205 M 760 205 L 760 180" class="ornament" />

  <!-- Decorative Swirl Lines under/over text -->
  <path d="M 280 85 Q 400 95 520 85" class="ornament" opacity="0.8" />
  <path d="M 310 185 Q 400 175 490 185" class="ornament" opacity="0.8" />

  <!-- Typography -->
  <!-- "HELLO, I AM" -->
  <text x="400" y="112" class="text-hello">HELLO, I AM</text>

  <!-- "TOKA" -->
  <text x="400" y="172" class="text-name">TOKA</text>
</svg>