      <stop offset="0.5" stop-color="#fff1aa"/>
      <stop offset="0.7" stop-color="#e9c55a"/>
      <stop offset="1" stop-color="#9b6715" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-25%" width="120%" height="160%">
