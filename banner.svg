      <stop offset="0.24" stop-color="#d3a32b"/>
      <stop offset="0.47" stop-color="#fff0a6"/>
      <stop offset="0.66" stop-color="#d8a82f"/>
      <stop offset="1" stop-color="#80500b"/>
