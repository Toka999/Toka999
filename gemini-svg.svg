<svg viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#16161d" />
    </linearGradient>

    <!-- Luxurious Gold Text Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="25%" stop-color="#fcf6ba" />
      <stop offset="50%" stop-color="#b38728" />
      <stop offset="75%" stop-color="#fbf5b7" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="800" height="200" rx="15" fill="url(#bg-grad)" stroke="#2b2b36" stroke-width="2" />

  <!-- Decorative Inner Border Frame -->
  <rect x="15" y="15" width="770" height="170" rx="10" fill="none" stroke="url(#gold-grad)" stroke-width="1" opacity="0.4" />

  <!-- Main Title: Hello, I'm -->
  <text x="50%" y="85" font-family="&#39;Playfair Display&#39;, &#39;Didot&#39;, &#39;Georgia&#39;, serif" font-size="34" font-weight="400" fill="#eaeaea" text-anchor="middle" opacity="0.9">
    Hello, I am
  </text>

  <!-- Accent Name: TOKA (Luxurious Gold Style) -->
  <text x="50%" y="145" font-family="&#39;Playfair Display&#39;, &#39;Didot&#39;, &#39;Georgia&#39;, serif" font-size="62" font-weight="700" fill="url(#gold-grad)" text-anchor="middle" filter="url(#glow)">
    TOKA
  </text>
  
  <!-- Subtle Sub-accent lines -->
  <line x1="260" y1="165" x2="340" y2="165" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.6" />
  <circle cx="400" cy="165" r="2.5" fill="#fcf6ba" opacity="0.8" />
  <line x1="460" y1="165" x2="540" y2="165" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.6" />
</svg>